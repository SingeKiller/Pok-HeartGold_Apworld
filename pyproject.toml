[project]
name = "pokemon-heartgold-apworld"
version = "0.1.0"
description = "Archipelago APWorld for Pokemon HeartGold & SoulSilver"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
