name: Archipelago unit tests

# Runs Archipelago's own test suite against this world, scoped to it with
# AP_TEST_WORLDS (see Archipelago's docs/tests.md). Complements build.yml,
# which only verifies the .apworld packages.
#
# Archipelago is pinned to an exact commit rather than a branch or tag so a
# red run always means this world changed, never that upstream moved
# underneath it. Bump AP_REF deliberately, in its own commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # ArchipelagoMW/Archipelago main as of 2026-08-11.
  AP_REF: fe5b49e1899b32bcb9f65e91cb7f74d6aa6d0ff8
  # Must match the folder name the .apworld builds under, i.e. build.py's
  # module_name(): archipelago.json's "game", lowercased, spaces to "_".
  WORLD_MODULE: pokemon_heartgold

jobs:
  test:
    runs-on: ubuntu-latest
    name: Archipelago unit tests

    steps:
      # Archipelago first: this world is checked out *into* its worlds/
      # folder below, and checkout cleans its target directory.
      - name: Check out Archipelago (pinned)
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.AP_REF }}
          path: Archipelago

      - name: Check out this world
        uses: actions/checkout@v4
        with:
          path: Archipelago/worlds/${{ env.WORLD_MODULE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/ is generated and git-ignored (see data_gen.py). __init__.py
      # regenerates it on import if missing, but doing it here keeps a
      # data_gen failure from surfacing as a confusing world-load error.
      - name: Generate data/
        working-directory: Archipelago/worlds/${{ env.WORLD_MODULE }}
        run: python data_gen.py

      # Same install Archipelago's own unittests workflow uses. --yes keeps
      # ModuleUpdate from prompting on stdin, and the WebHostLib append is
      # what lets test/webhost/* import at all.
      - name: Install Archipelago dependencies
        working-directory: Archipelago
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          python Launcher.py --update_settings  # make sure host.yaml exists for tests

      - name: Run unit tests
        working-directory: Archipelago
        env:
          AP_TEST_WORLDS: ${{ env.WORLD_MODULE }}
        run: pytest -n auto
