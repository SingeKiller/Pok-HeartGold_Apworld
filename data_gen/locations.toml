# behind it (see data_gen/rules.toml's `events` requirement field, task
# M0.3). Like a badge location, this has no `original_item` and no real
# ROM address -- reaching its region grants the named `event` flag instead.
# elite_four_defeated: the Johto Elite Four + Champion Lance physically
# block the path through pokemon_league_entrance's room chain until beaten
# (see data_gen/rules.toml's header note on this), so pokemon_league_hall_
# of_fame is only ever reached after they're all defeated -- confirmed by
# scr_seq_0740_T01R0301.s, which sets FLAG_UNLOCKED_MT_SILVER in this exact
# room at the same time Silver hands over HM08.
[elite_four_defeated_event]
region = 'pokemon_league_hall_of_fame'
type = 'event'
event = 'elite_four_defeated'
id = 0
label = 'Hall of Fame - Elite Four defeated'

# type = 'trainer' (task M3.3, Trainersanity): one real, fillable AP location
# per std_trainer(...) trainer-battle person-event object found in every
# zone_event/*.json in scope (390 total, cross-checked against the plan's own
# figure). Unlike badge/event locations, these ARE real fillable locations (no
# vanilla item to displace, so create_items() contributes a filler item per
# location instead of an original_item -- see __init__.py). No original_item
# field. The new "trainer" field is this trainer's data_gen/trainers.toml key,
# used by location_flags.py to compute its real vanilla savedata flag
# (TRAINER_FLAG_BASE + trainers.toml[trainer].id, include/constants/flags.h,
# already the same flags array client.py polls every tick -- confirmed live by
# script_manager.c's SetTrainerFlag/CheckTrainerFlag). Only created at all when
# the trainersanity option is on (see locations.py's create_locations).
#
# Known nuance, not a bug (see this task's handoff notes): 52 of these 390
# trainers also have their flag set automatically the moment their gym's Leader
# is defeated (each gym script has its own explicit SetTrainerFlag calls for a
# handful of its own regular trainers, decomp-confirmed) -- a real vanilla
# convenience (skips re-fighting trainers you dodged on the way to the Leader),
# not something this project introduces or can suppress.

