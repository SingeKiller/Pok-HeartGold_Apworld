# type = 'dexsanity' (task M3.4, Dexsanity): one reserved AP location per
# real-national-dex species (493 total, species.real_species_pool's own
# universe -- excludes HGSS alt forms: Deoxys/Wormadam/Giratina Origin/
# Shaymin Sky/Rotom, same exclusion wild-encounter randomization already
# uses). Every species gets an id here (like 'trainer' locations reserve
# ids for all 390 trainers regardless of trainersanity), but a given
# location is only actually created for a seed where that species genuinely
# appears somewhere in world.generated_encounters -- see
# species.species_encounter_methods and locations.py's create_locations.
# Static/gift Pokemon (starters, legendaries, in-game gifts) are excluded:
# they're vanilla/fixed in this project (see data_gen/locations.toml's own
# header, C4/C5's "excluded from this pass" note), never wild-randomized,
# so they can never be "seed-aware scoped" the way a wild table entry can.
#
# region is fixed to 'new_bark' for every entry -- always reachable with no
# gate of its own, since Dexsanity's real gating is entirely on the
# location's access_rule (built from species_encounter_methods in
# locations.py: requires owning an HM+badge for surf/rock_smash, or the
# matching rod for a fishing-only species; no rule at all if the species is
# also obtainable from plain grass or headbutt anywhere). Like 'trainer'
# locations, no original_item field: create_items() contributes a filler
# item per created location instead (see __init__.py) -- Dexsanity checks
# never hold a progression item, since the access rule is deliberately
# looser than this seed's real per-region logic (see options.py's
# Dexsanity docstring).

