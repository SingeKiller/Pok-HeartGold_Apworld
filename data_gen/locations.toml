# data_gen/locations.toml
#
# Source: ressources/Decomposition/pokeheartgold (read-only, gitignored),
# task C4 (Johto locations) + task C5 (Kanto locations, see docs/scope.md
# v1). Machine-extracted; see this repo's C4/C5 handoff notes for the full
# extraction methodology.
#
# Scope: Johto + Kanto (see data_gen/regions.toml's header for Kanto's own
# region-graph scope boundary; location extraction below only ever looks at
# maps already present in regions.toml). 5 location `type`s:
#   - ground_item: overworld item balls (std_itemball_* scripts).
#   - hidden_item: Itemfinder-only items (std_hiddenitem_* scripts).
#   - npc_gift: an NPC/event hands over a bag item directly (no item ball).
#   - hm_tm: any HM or TM, regardless of how it's actually obtained in
#     vanilla (a ground item ball, e.g. TM41 on Route 8, or an NPC gift,
#     e.g. HM01 from the Ilex Forest apprentice) -- HM/TM gets its own
#     type per this task's spec (so e.g. an "HM/TM shuffle" option can
#     target them independent of the ground_item/npc_gift split), taking
#     priority over ground_item/npc_gift for any location whose
#     original_item is hm01-hm08/tm01-tm92.
#   - badge: one of the 8 Johto gym badges (GiveBadge script command).
#
# Excluded from this pass (out of v1 scope or ambiguous, see docs/scope.md
# and this task's C4/C5 handoff notes): Pokemon/egg rewards (Eevee from
# Bill, Dratini from the Dragon's Den master, the Primo eggs, the Togepi
# egg pickup call, and -- C5 -- the Steven/Latios-Latias postgame encounter
# in Pewter City) -- these are Pokemon, not items, and belong to a future
# static/gift-Pokemon task, not this items/locations one. Repeatable/daily
# or paid NPC "gifts" (e.g. the Violet City and Fuchsia City "random berry
# of the day" NPCs; C5's Kanto equivalents: the Route 25 Sea Cottage man's
# cycling evolution-stone gift, the Fuchsia shard trader, the Fuchsia Pal
# Park entrance's random berry, and the Celadon Dept. Store roof vending
# machine) are excluded as they're not a meaningful one-time check. Radio
# Card and the Pokegear are v2 (docs/scope.md's "Radio Card / PokeGear
# features"). Kurt's apricorn-ball crafting is v2. The Bug Catching
# Contest room (National Park), Pokeathlon Dome, and Safari Zone are v2.
# C5 also excludes one apparent duplicate: Pewter City (T03) has a second,
# alternate trigger for the same Rainbow Wing/Silver Wing key item already
# captured at goldenrod_radio_tower_observation_deck (C4) -- both are
# guarded by the exact same decomp flag (FLAG_UNK_093/094), so only one
# real check exists; kept at its original C4 location.
#
# The S.S. Aqua ferry (map code P01*) was excluded from C4's pass (Johto
# only, no Kanto regions existed yet to hang its Vermilion end off of) but
# is included as of C5, now that data_gen/regions.toml models the whole
# ferry (Olivine <-> ship <-> Vermilion) as its own set of regions.
#
# ground_item / hidden_item extraction (fully mechanical): every
# zone_event/*.json object/bg entry whose scriptId matches
# std_itemball_<map>_<item> / std_hiddenitem_<map>_<item> is one location;
# `id` is the matching include/constants/flags.h FLAG_HIDE_ITEMBALL_*
# value (ground_item) or include/constants/hidden_items.h HIDDENITEM_*
# value (hidden_item) -- both are decomp-native stable identifiers for
# these, not synthesized here. A few hidden items are shared border
# placements referenced from two neighboring map files (e.g.
# HIDDENITEM_R29_R30_T21_NUGGET, or C5's HIDDENITEM_R26_R27_NUGGET and
# HIDDENITEM_T09_W21_RARE_CANDY); only one location is kept per unique
# decomp id (no double-counting), attached to the first map in the name.
# C5 additionally found one hidden item id (Mt. Moon Square's max_revive,
# D02R0103) duplicated verbatim -- object-for-object -- on the adjacent
# Clefairy-event variant of the same room (D02R0104, a mutually-exclusive
# alternate state of the same physical space); kept once, at its
# mount_moon_square (D02R0103) owner map.
#
# npc_gift extraction: cross-referenced from three decomp script patterns
# (`CallStd std_give_item_verbose`, `CallStd std_obtain_item_verbose`,
# `GiveItemNoCheck ITEM_*`) across every scr_seq/*.s file for a map in
# regions.toml, filtered to bag items only (see exclusions above). `id` is
# the matching include/constants/flags.h FLAG_GOT_<ITEM>_FROM_<GIVER>
# value where one exists (most do, and conveniently self-document the
# giver in the constant name); a handful of gifts have no single-purpose
# FLAG_GOT_* constant (they're guarded by a different, reused, or absent
# flag) and get a sequential id in a reserved 9000+ band instead, noted
# inline (C5 continues this band from C4's highest used id, 9022, starting
# at 9023).
#
# badge extraction: fully mechanical, `grep -rn GiveBadge
# files/fielddata/script/scr_seq` -- `id` is the badge's own
# include/constants/badge.h BADGE_* value (0-7 for the 8 Johto badges,
# 8-15 for the 8 Kanto badges added in C5). Note: BADGE_RISING
# (Blackthorn) is granted at the Dragon's Den Shrine, not at the
# Blackthorn Gym itself -- Clair's gym battle alone does not give it in
# this game; this is a real, decomp-verified vanilla mechanic (you must
# then prove yourself at the Dragon's Den shrine), not a bug. All 8 Kanto
# gym leaders instead hand their badge over directly at the gym, matching
# their own scr_seq's GiveBadge call one-for-one.
#
# region: the parent data_gen/regions.toml region key.
# original_item: the data_gen/items.toml key of the vanilla item found
# here (ground_item/hidden_item/npc_gift only, absent for badge).

