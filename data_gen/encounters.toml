# data_gen/encounters.toml
#
# Source: ressources/Decomposition/pokeheartgold (read-only, gitignored),
# task C7a (wild encounters). Machine-extracted from two decomp files:
#   - files/fielddata/encountdata/gs_enc_data.json: land/surf/rock_smash/
#     fishing (old/good/super rod) tables, 142 map entries (see
#     docs/architecture.md Spike 3).
#   - files/arc/headbutt.json: headbutt (coup d'boule) tree tables, 540 map
#     entries total but only 60 non-empty (the rest are `{Map: ..., Trees:
#     [], ...}` placeholders with no headbuttable trees at all).
#
# Zone resolution: each decomp `map` code is looked up against
# data_gen/regions.toml's `map_code` field to find the region key this
# entry belongs to (one encounter table set per region, keyed the same way
# regions.toml itself is). Of the 146 distinct map codes across both source
# files (142 from gs_enc_data.json + 4 headbutt-only maps that have a
# headbutt table but no gs_enc_data.json entry at all: T23/T03/R16/D47),
# 137 resolve to a region and are included below; 9 do not and are
# deliberately dropped, all verified harmless:
#   - D47 / D47R0102 (Safari Zone gate + interior): out of v1 scope, see
#     docs/scope.md and data_gen/locations.toml's header (Safari Zone is
#     explicitly excluded there too); D47R0102 is the only unresolved
#     gs_enc_data.json entry that actually has non-zero rates, but there is
#     no data_gen/regions.toml region to attach it to since Safari Zone
#     itself was never modeled as a region.
#   - UNUSED_045, UNUSED_047, UNUSED_049, UNUSED_050, UNUSED_064,
#     UNUSED_138, and a bare numeric placeholder "090": all have every
#     table's rate at 0 with zero mons in gs_enc_data.json (verified), i.e.
#     genuinely dead/unused encounter slots -- same spirit as
#     data_gen/regions.toml's dead-data exclusions.
#
# Version resolution: gs_enc_data.json encodes 643 real
# HEARTGOLD-vs-SOULSILVER differences (different level and/or species per
# version, e.g. Route 29's morning Sentret/Rattata swap) as
# `{"HEARTGOLD": ..., "SOULSILVER": ...}` dicts; headbutt.json does the same
# (79 differences) with `{"gold": ..., "silver": ...}` dicts. This project
# now supports both HeartGold and SoulSilver (see rom/__init__.py's MD5
# detection and options.py's game_version option), so every field that
# actually diverges between versions is kept as a
# `{ heartgold = ..., soulsilver = ... }` inline sub-table below instead of
# collapsing to a single value; fields that do not diverge stay a plain
# scalar. data_gen_templates/encounters.py resolves each field for the
# requested version at generation time.
#
# Species are recorded as data_gen/species.toml keys (SPECIES_FOO ->
# foo, matching every species's `label.lower()`), not raw decomp species
# constants, so data_gen_templates/encounters.py can cross-reference
# data_gen/species.toml directly like every other generator in this
# pipeline.
#
# Table shapes:
#   - land: time-of-day dependent (HGSS-specific). Each slot has a `level`
#     (int) and a `morn`/`day`/`nite` species triple (often, but not
#     always, morn == day with a different nite species -- see e.g.
#     route_29 below). `rate` is the table's own encounter-trigger rate
#     from the decomp (0 when the zone has no grass/cave-floor encounters
#     at all).
#   - surf / rock_smash / fishing.{old,good,super}_rod: no time-of-day
#     split. Each slot has `level_min`/`level_max` and a single `species`.
#   - headbutt: only present as a `[<region>.headbutt]` sub-table for the
#     59 (of 137) zones that actually have headbuttable trees (per
#     headbutt.json). Slots are split into `common`/`rare`/`secret`
#     (matching src/field/headbutt.c's TREETYPE_COMMON/RARE/SECRET), each
#     entry has `level_min`/`level_max`/`species`. There is no `rate`
#     field for headbutt -- which of the three tables applies is decided
#     by which tree (and the player's trainer ID) was headbutted, a
#     per-tree/per-trainer lookup table in the game's own code, not a
#     simple probability -- so none is fabricated here.
#
# Deviates from most other data_gen/*.toml files' array-of-tables style
# (e.g. `[[bulbasaur.evolutions]]` in data_gen/species.toml) in one way:
# slot lists use TOML inline-table arrays (`slots = [ { ... }, { ... } ]`)
# instead, since a single zone can have 50+ slots across its tables and the
# array-of-tables form would make this file enormous and hard to skim.

