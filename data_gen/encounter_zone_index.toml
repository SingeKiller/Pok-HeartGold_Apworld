# data_gen/encounter_zone_index.toml
#
# Source: ressources/Decomposition/pokeheartgold/files/fielddata/encountdata/
# gs_enc_data.json ("encounters" array) -- this array's own index order is
# the real raw g_enc_data.narc (a/0/3/7) sub-file index, confirmed against
# the real ROM (index 0 == map T20 == new_bark, byte-for-byte: surf slots
# decode to Tentacool/Tentacruel exactly matching data/encounters.py's own
# new_bark zone). Generated once by matching each data/encounters.py zone's
# own "map_code" field against gs_enc_data.json's "encounters[i].map" (see
# docs/architecture.md's "## M4.5" section for the verification this ran).
#
# 134 of data/encounters.py's 137 zones matched -- the other 3
# (route_16/R16, pewter/T03, azalea/T23) have a headbutt table
# (files/arc/headbutt.json / the headbutt NARC, a *different* table, not
# read/written by rom/encounterdata.py at all) but no gs_enc_data.json entry
# whatsoever -- see data_gen/encounters.toml's own header, which already
# flags these exact 3 map codes as "headbutt-only". Not resolvable here
# because there is no raw index to resolve: these zones have no
# land/surf/rock_smash/fishing encounter data in the ROM at all to patch.

