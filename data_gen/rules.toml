# --- Dark Cave: Rock Smash AND Strength, on both ways out ----------------
# Entering the cave from Route 31 is free; crossing it is not. Both
# requirements confirmed by the user on an interactive in-game map
# (2026-08-22) and backed by zone_event 169_D42R0102.json
# (dark_cave_route_31_side), which is the map that holds every obstacle:
# one SPRITE_ROCK (Strength boulder) at (28,20) and four SPRITE_BREAKROCK
# at (17,17), (17,18), (40,13) and (55,53), against warps at (5,26) for
# Route 31, (26,4) for the Route 45 side and (55,56) for Route 46. The
# entrance warp is walled off from both far warps by the (17,17)/(17,18)
# pair, and the Route 46 warp has a breakrock of its own three tiles away,
# hence rock_smash on both crossings; the single boulder at (28,20) sits on
# the shared inner path, hence strength on both too.
#
# Until 2026-08-22 the Route 45 crossing asked for Strength alone and the
# Route 46 one asked for nothing at all, which put Route 46's northern half
# in sphere 0 through the cave.
[[exit_rule]]
from = "dark_cave_route_45_side"
to = "dark_cave_route_31_side"
hms = ["rock_smash", "strength"]

[[exit_rule]]
from = "dark_cave_route_31_side"
to = "route_46_north"
