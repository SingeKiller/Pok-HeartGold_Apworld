# --- Waterfall (rising badge) -------------------------------------------
[[exit_rule]]
# Tohjo Falls' hidden grotto: reached by swimming/climbing up the waterfall
# itself (public HGSS route-guide knowledge; data_gen/regions.toml only
# gives Tohjo Falls 2 exits total: route_27 and this hidden room, so this is
# its one non-route_27 connection). SPRITE_BREAKROCK *also* confirmed on
# D45R0102 (zone_event 269_D45R0102.json, the hidden room itself) for an
# item inside, so both HMs are required to fully reach it. One-way: you can
# leave the hidden room without climbing back up (there is no known vanilla
# check gating the return trip), so bidirectional = false.
from = "tohjo_falls"
to = "tohjo_falls_hidden_room"
bidirectional = false
hms = ["waterfall", "rock_smash"]

