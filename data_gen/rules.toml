# Cerulean Cave: the man standing outside its entrance is only removed when
# the Earth Badge is handed over -- scr_seq_0743_T02GYM0101.s:65 sets
# FLAG_HIDE_CERULEAN_CITY_MAN_OUTSIDE_CAVE inside the very same
# `GiveBadge BADGE_EARTH` block. Verrou D10. Rock Climb's own earth-badge
# requirement elsewhere is a coincidence of the same badge, not the same
# gate: nothing here needs HM08.
[[exit_rule]]
from = "cerulean"
to = "cerulean_cave_1f"
badges = ["earth"]

