# (l. 165), the man blocking the Viridian Gym door until then. This is not
# the generic "N of M badges" primitive it first looks like: `data/rules.py`
# only ever expresses "all of these badges" (rules.py's `_make_access_rule`
# does `all(state.has(...) for badge in badge_names)`), no partial-count
# form exists anywhere in this codebase, and none is added here per the
# no-new-mechanism instruction. It does not need one -- Earth (Viridian's
# own badge, badges.toml's `earth = 15`) is the 8th and last Kanto badge, so
# there are exactly 7 non-Earth Kanto badges to have, and "7 of a possible
# 7" is exactly "all 7": `badges = [...]` with the other seven Kanto badges
# named is the exact translation of VAR_UNK_4135 >= 7, not an approximation.
# Blue's own trip to Cinnabar Island first (Surf, since it is an island) is
# not modeled on top of this: it is implied by the same 7 badges already
# demanding heavy Kanto progress by this point, and folding it in would only
