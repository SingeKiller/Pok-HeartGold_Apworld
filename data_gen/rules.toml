# --- Key items (non-HM) --------------------------------------------------
[[exit_rule]]
# Boarding the S.S. Aqua at Olivine: `HasItem ITEM_S_S__TICKET` gate,
# decomp-verified in files/fielddata/script/scr_seq/scr_seq_0152_P01R0101.s
# (P01R0101 = ss_aqua_olivine_port_interior). The same check is *not*
# present on the Vermilion side's own scripts, but the S.S. Ticket is a
# permanent key item (never consumed) so gating both directions is
# equivalent and safe.
from = "ss_aqua_olivine_port_interior"
to = "ss_aqua_olivine_port_exterior"
items = ["s_s_ticket"]

# --- Known limitations (documented, not hidden; see this task's handoff
# notes for the full rationale) --------------------------------------------
# The following data_gen/items.toml "progression" key items were
# specifically investigated (per this task's brief) and found to NOT gate
# any data_gen/regions.toml exit in vanilla, so they are intentionally
# absent from [[exit_rule]] above:
#   - squirtbottle: revives the Route 36 Sudowoodo (`HasItem
#     ITEM_SQUIRTBOTTLE` in scr_seq_0243_R36.s), but Route 36 is a single
#     data_gen/regions.toml region (no sub-map node either side of the
#     tree) -- this is a real vanilla gate that this graph's per-map
#     granularity cannot express as an inter-region exit.
#   - secretpotion: `TakeItem ITEM_SECRETPOTION` at the Olivine Lighthouse
#     light room (scr_seq_0066_D27R0107.s) is Jasmine's Amphy-cure
#     questline delivery -- dialogue/plot only, does not block any route.
#   - card_key / basement_key: both only ever appear behind `GetItemQuantity`
#     dialogue checks on NPCs/signs in Goldenrod Radio Tower and the
#     Goldenrod Tunnel (Team Rocket HQ) dead-end rooms -- no decomp evidence
#     of an actual locked-door/warp block tied to either item.
#   - mystery_egg: Elm's starting fetch-quest item; no scr_seq evidence of
#     it gating a route (it flips story/dialogue flags only).
#   - bicycle, old_rod/good_rod/super_rod: no evidence of gating a
#     data_gen/regions.toml exit (Bicycle is a speed convenience; the rods
#     gate specific fishing *locations*, not region traversal -- out of
#     this task's `exits`-only scope).
# Two additional gates were found but are deliberately NOT modeled here
# because they are pure story/event flags with no corresponding
# data_gen/items.toml or [badges] entry to attach a rule to (no "own this"
# state exists yet to check against): FLAG_UNLOCKED_WEST_KANTO and
# FLAG_UNLOCKED_MT_SILVER, both guarding NPC policemen at the Route 22
# Pokemon League reception gate (R22R0101; see scr_seq_0213_R22R0101.s and
# scr_seq_0741_T02.s/scr_seq_0740_T01R0301.s for where they get set --
# Kanto/Viridian progress and post-Elite-Four Mt. Silver access,
# respectively). Left for a future task once this project has an event/flag
# concept (e.g. alongside victory-condition work) -- flagged here rather
# than silently omitted.
# No genuine "badge alone, no HM" exit gate was found in this pass (the
# `badges` field of [[exit_rule]] above is unused for now, kept only for
# schema extensibility/future correction) -- every `CheckBadge` call found
# in scr_seq/*.s is either a gym-rematch dialogue flavor check or an
# unrelated side-event condition (e.g. the Sinjoh Ruins Mystri Stone
# trigger in D24R0101, itself v2/out of scope), never a passage block.
