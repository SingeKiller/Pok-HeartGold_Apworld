# data_gen/rules.toml
#
# Source: ressources/Decomposition/pokeheartgold (read-only, gitignored),
# task C6 (region-exit access rules). For every `data_gen/regions.toml`
# `exits` connection that is actually gated in vanilla HGSS by an HM+badge
# or a key item, this file records the requirement. Connections with no
# entry below are free (no known vanilla gate) -- this file only ever adds
# restrictions on top of `data_gen/regions.toml`'s raw graph, never removes
# an edge, so "is the raw graph connected" is untouched by anything here.
#
# Methodology: decomp-verified where practical, cross-checked against public
# HGSS route-guide knowledge where the decomp's own map-graph granularity
# (data_gen/regions.toml models one node per *map*, not per sub-map tile/
# obstacle -- see its header) makes an exact tile-level trace impractical.
# Every entry below cites its evidence inline. Two ground-truth decomp
# sources anchor all of it:
#   - src/field_move.c: each FieldMove_Check<Move> function's own
#     PlayerProfile_TestBadgeFlag(..., BADGE_*) call -- this is the
#     authoritative field-move-to-badge mapping (hm_badges below), and also
#     shows Fly and Flash have NO map/exit gating at all (see below).
#   - files/fielddata/eventdata/zone_event/*.json: each map's `objects`
#     array; an object with spriteId SPRITE_TREE/SPRITE_ROCK/SPRITE_BREAKROCK
#     (include/constants/sprites.h 84-86) is a Cut tree / Strength boulder /
#     Rock Smash rock placed on that specific map (see src/field_move.c's
#     FieldMove_InitCheckData, which sets FIELD_MOVE_CHECK_TREE/ROCK/
#     BREAKROCK from exactly these sprite ids) -- a strong, decomp-native
#     signal for *which* maps contain each obstacle type, even though the
#     exact in-map tile position (and therefore which of a multi-exit
#     region's `exits` it blocks) still needs cross-referencing against the
#     map's own exits / public route knowledge.
#
# hm_badges: the badge vanilla requires to *use* each field move outside of
# battle (src/field_move.c). Note this is a Gen4-remake-specific mapping,
# not the Gen1-3 original: e.g. Rock Smash needs BADGE_ZEPHYR (the *first*
# Johto badge) here, not "no badge" like Gen3. Two field moves are
# deliberately absent:
#   - fly: FieldMove_CheckFly requires BADGE_STORM, but Fly only ever
#     fast-travels to an already-visited town -- it never grants access to a
#     region unreachable by any other means, so it never gates a
#     data_gen/regions.toml exit and has no entry in [[exit_rule]] below.
#   - flash: FieldMove_CheckFlash requires no badge at all (confirmed: no
#     PlayerProfile_TestBadgeFlag call in that function), and unlike
#     Gen1-3, HGSS darkness (WEATHER_FLASH) never blocks movement -- it only
#     reduces the visible radius. It therefore never gates a
#     data_gen/regions.toml exit either.
# hm_items: each HM's own data_gen/items.toml key (hm01-hm08), cross-checked
# against data_gen/moves.toml's [tm_hm] table (hm01=cut .. hm08=rock_climb) --
# also includes fly for completeness/documentation even though it's unused
# by any [[exit_rule]] below.
[hm_badges]
cut = "hive"
surf = "fog"
strength = "plain"
rock_smash = "zephyr"
waterfall = "rising"
whirlpool = "glacier"
rock_climb = "earth"

[hm_items]
cut = "hm01"
fly = "hm02"
surf = "hm03"
strength = "hm04"
whirlpool = "hm05"
rock_smash = "hm06"
waterfall = "hm07"
rock_climb = "hm08"

# badges: canonical badge key -> include/constants/badge.h BADGE_* value.
# Badges are save-data flags in this game, not data_gen/items.toml entries
# (see that file's header), so this is their only canonical name table.
# Cross-checked against data_gen/locations.toml's 16 `type = 'badge'`
# locations, whose own `id` field is this exact same badge.h value (e.g.
# violet_gym_badge id=0 .. viridian_gym_badge id=15) -- both tables agree.
[badges]
zephyr = 0
hive = 1
plain = 2
fog = 3
storm = 4
mineral = 5
glacier = 6
rising = 7
boulder = 8
cascade = 9
thunder = 10
rainbow = 11
soul = 12
marsh = 13
volcano = 14
earth = 15

# [[exit_rule]]: one gated data_gen/regions.toml exit connection.
#   from / to: data_gen/regions.toml region keys.
#   bidirectional: defaults to true (the requirement applies to both
#     from->to and to->from); set to false for a one-way-only obstacle
#     (e.g. you can jump down a waterfall without the HM, but not climb it).
#   hms: list of hm_badges/hm_items keys; each contributes BOTH its HM item
#     (hm_items) and its field-use badge (hm_badges) to the requirement,
#     ANDed together with everything else on the same entry.
#   items: extra data_gen/items.toml keys required (non-HM key items).
#   badges: extra badges keys required with no associated HM (the Elite
#     Four's 8-badge gate, plus the two single-badge passage blocks found
#     in the 2026-08-23 census -- see the "Badge-only gates" section).
#   events: scenario flags with no bag item or badge behind them, granted
#     by a `type = 'event'` data_gen/locations.toml location
#     (`elite_four_defeated`, plus the six Johto story locks of the
#     2026-08-23 event census -- see the "Johto story locks" section).

# --- Cut (hive badge) -------------------------------------------------
# Ilex Forest's own Cut tree, splitting the map in two AP regions
# (`ilex_forest` Azalea-side, `ilex_forest_north` Route 34-side -- see
# data_gen/regions.toml's own comment on the split, task: Ilex Forest
# soft-lock fix, 2026-08-18) -- the mandatory story Cut check (you receive
# HM01 inside this same forest, just after beating Azalea's gym for the
# Hive Badge). SPRITE_TREE confirmed on D36R0101 (zone_event
# 114_D36R0101.json). The internal edge is gated; `ilex_forest_north`'s own
# further exit to `route_34_ilex_forest_gatehouse` needs nothing extra,
# matching vanilla (once past the tree, the Route 34 exit itself is free).
[[exit_rule]]
from = "ilex_forest"
to = "ilex_forest_north"
hms = ["cut"]

# --- Surf (fog badge) --------------------------------------------------
# Every data_gen/regions.toml exit touching a `W`-map-code water route
# (W40/W41 Johto, W19/W20/W21 Kanto -- see data_gen/regions.toml's header)
# requires Surf to cross; these are the only regions whose entire map is
# open water.
[[exit_rule]]
from = "olivine"
to = "route_40"
hms = ["surf"]

[[exit_rule]]
from = "route_40"
to = "route_41"
hms = ["surf"]

[[exit_rule]]
from = "route_41"
to = "cianwood"
hms = ["surf"]

[[exit_rule]]
from = "route_41"
to = "whirl_islands_1f"
hms = ["surf"]

[[exit_rule]]
from = "pallet"
to = "route_21"
hms = ["surf"]

[[exit_rule]]
from = "route_21"
to = "cinnabar_island"
hms = ["surf"]

# Verrou D7 rides on this one (2026-08-23), so it carries a badge as well as
# an HM. This used to be `route_19 -> fuchsia`; that direct edge was a
# mapmatrix false positive and data_gen/regions.toml removed it, leaving the
# gatehouse as Fuchsia's only way onto Route 19 (W19's own two warps both
# lead back into it). Surf, because W19 is open water; the Volcano Badge,
# because 4 SPRITE_STOP barriers and 2 workmen (obj_W19_stop..._stop_4 and
# obj_W19_workman/_2 in 088_W19.json, at z=457/458, four tiles below the
# gatehouse door) hold the beach until FLAG_UNK_265 and
# FLAG_HIDE_ROUTE_19_WORKMEN_CLOSED are set -- which happens in
# scr_seq_0015_D11R0106.s:94-95, inside Blaine's own `GiveBadge
# BADGE_VOLCANO` block two lines above. Bidirectional: a badge is permanent
# and the barriers are gone for good once it is earned, so both directions
# are equivalent (and the barriers face the gatehouse door either way, so
# they also stop a swimmer coming up from Route 20 walking into Fuchsia).
#
# REPORTED, NOT CHANGED: this is a gate, not a chokepoint. Routes 19 and 20
# and the Seafoam Islands are still reachable badgeless from the other end,
# by Surf alone: pallet -> route_21 -> cinnabar_island -> route_20 ->
# route_19. That is real vanilla geography (Cinnabar is a Surf destination
# from Pallet in its own right), not a phantom edge, so nothing is removed;
# what the Volcano Badge really gates is the Fuchsia doorway.
# tests/test_rules.py::test_route_19_beach_needs_the_volcano_badge pins both
# halves.
[[exit_rule]]
from = "route_19_fuchsia_gatehouse"
to = "route_19"
hms = ["surf"]
badges = ["volcano"]

[[exit_rule]]
from = "route_19"
to = "route_20"
hms = ["surf"]

[[exit_rule]]
from = "route_20"
to = "cinnabar_island"
hms = ["surf"]

[[exit_rule]]
from = "route_20"
to = "seafoam_islands_1f"
hms = ["surf"]

# Route 27 (map_code R27, a land route, not a `W` code) still has a
# mandatory water crossing between New Bark Town and Route 26: confirmed by
# its own [route_27.surf] Tentacool/Tentacruel encounter table in
# data_gen/encounters.toml, decomp-native proof of water tiles on this map
# (the W-map-code heuristic above only catches maps that are entirely
# water, missing routes like this one that mix land and water).
[[exit_rule]]
from = "new_bark"
to = "route_27"
hms = ["surf"]

# The Lake of Rage's own water, splitting T29 in two AP regions
# (`lake_of_rage`, the Route 43 shore with the Fishing Guru's house, and
# `lake_of_rage_north`, the Hidden Power house's bank and the three item
# patches across the lake -- see data_gen/regions.toml's own comment on the
# split, task: Lake of Rage start-location soft-lock fix, 2026-08-23).
# Same shape as the Route 27 entry above and found the same way, by water
# tiles rather than by a W map code: T29 is a land map with a lake in the
# middle, so the "entire map is open water" heuristic misses it. Proof is
# the ROM's own land_data terrain bytes (see data_gen/regions.toml): the
# two banks are separated by terrain byte 0x10, fresh water, the same value
# the red Gyarados stands on at (525, 71).
[[exit_rule]]
from = "lake_of_rage"
to = "lake_of_rage_north"
hms = ["surf"]

