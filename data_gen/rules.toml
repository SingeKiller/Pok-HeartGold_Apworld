# the fork leading to both B3F and the Lugia chamber).
[[exit_rule]]
from = "whirl_islands_b2f"
to = "whirl_islands_b3f"
hms = ["whirlpool"]

# Corrected again (player report, SoulSilver): the gate is the Silver Wing
# *handover*, not owning the item. FLAG_UNK_094 is only set by the vanilla
# handover script (scr_seq_0750_T03.s:65 in HeartGold, Pewter;
# scr_seq_0034_D23R0106.s:86 in SoulSilver, Radio Tower), never by a wing
# received from the multiworld, hence `events = ["silver_wing_handed_over"]`
# (data_gen/locations.toml's silver_wing_handed_over_event, placed where
# that version's NPC stands) instead of `items = ["silver_wing"]`. The
# older D12 note below is kept for the history of this edge.
#
# The Lugia chamber is gated on the Silver Wing, not on the Hall of Fame
# (verrou D12, corrected 2026-08-23): the chamber's own script
# scr_seq_0103_D40R0104.s tests FLAG_UNK_094 twice (lines 40 and 49), and
# that flag is the Silver Wing's, not FLAG_GAME_CLEAR. In vanilla the two
# coincide (the Wing is handed over at the Radio Tower late enough that
# players arrive here post-league), which is why this entry previously read
# `events = ["elite_four_defeated"]` (task "Ho-Oh/Lugia comme Pokemon
# statiques", 2026-08-15) -- but with a randomized item pool the Wing can
# turn up at any time, so the real requirement is the one the script tests.
# (The script is the monk standing on B2F: with FLAG_UNK_094 set he shows
# the wing, sets FLAG_UNK_106 and steps aside, which is what the map's own
# scr_seq_D40R0104_001 MovePersonFacing branch replays on every later
# load.) Lugia's own visibility does not need the event either:
# FLAG_HIDE_WHIRL_ISLAND_LUGIA is cleared by the wing handover script
# (scr_seq_0750_T03.s:66) as well as by the Hall of Fame
# (scr_seq_0825_T10R0701.s:123), so data_gen/locations.toml's catch_lugia
# stays consistent with this edge. Combined with the Whirlpool requirement
# above (AND, not a separate blocking gate), which is unchanged.
[[exit_rule]]
from = "whirl_islands_b2f"
to = "whirl_islands_b3f_lugia_cave"
hms = ["whirlpool"]
events = ["silver_wing_handed_over"]

# --- Cliff Edge Gate (Secret Potion) -------------------------------------
# The Cliff Edge Gate is the only crossing between Cianwood and Route 47
# (the direct cianwood <-> route_47 edge was removed on 2026-08-23, see
# data_gen/regions.toml's [route_47] block). It needs NO HM: the gate is a
# walk-through (enter from Cianwood, go up the stairs, exit on Route 47),
# which is how vanilla reaches the Safari Zone long before HM08 Rock Climb
# (given in Oak's lab, scr_seq_0740_T01R0301.s:201). The receptionist's
# line msg_0136_D48R0101_00002 says so; Chuck's Rock Climb + Surf line
# (_00008) is about the Embedded Tower, not the gate. Rock Climb was
# wrongly required here until 2026-09-17, which pushed Route 47/48, the
# Safari Zone and their locations behind the Earth Badge.
#
# The Secret Potion is required (verrou A9, user map verification
# 2026-08-23): two workers stand in the gate itself while FLAG_UNK_249 is
# set, and that flag is cleared in scr_seq_0911_T26.s:39, the Olivine
# script that runs once Jasmine's Secret Potion errand is done.
[[exit_rule]]
from = "cliff_edge_gate"
to = "cianwood"
items = ["secretpotion"]

[[exit_rule]]
from = "cliff_edge_gate"
to = "route_47"
items = ["secretpotion"]

# --- Key items (non-HM) --------------------------------------------------
[[exit_rule]]
# Boarding the S.S. Aqua at Olivine: `HasItem ITEM_S_S__TICKET` gate,
# decomp-verified in files/fielddata/script/scr_seq/scr_seq_0152_P01R0101.s
# (P01R0101 = ss_aqua_olivine_port_interior). The same check is *not*
# present on the Vermilion side's own scripts, but the S.S. Ticket is a
# permanent key item (never consumed) so gating both directions is
# equivalent and safe.
#
# The ticket alone is NOT enough (verrou D1, 2026-08-23): the very same
# sailor script tests FLAG_GAME_CLEAR at line 119, *before* it ever looks at
# the ticket at line 129 -- the ferry does not sail until the Elite Four and
# Champion are beaten. Modeled with the `elite_four_defeated` event rather
# than ROM-patched away (explicit user decision: the sailor stays vanilla,
# so the logic has to match him). Without this, the whole of Kanto sat one
# key item away from the start of the game.
from = "ss_aqua_olivine_port_interior"
to = "ss_aqua_olivine_port_exterior"
items = ["s_s_ticket"]
events = ["elite_four_defeated"]

# The Goldenrod <-> Saffron Magnet Train: `HasItem ITEM_PASS`, decomp-
# verified on both ends (scr_seq_0893_T25R0501.s:80 for Goldenrod,
# scr_seq_0834_T11R0601.s:92 for Saffron; the refusal message is
# msg_0587_T25R0501_00002, "you need a Magnet Train Pass"). The check sits
# on the station attendant downstairs, i.e. before the ride, so it is
# modeled on the platform-to-platform edge -- the only edge the ride
# actually is now that data_gen/regions.toml merges each city's two platform
# maps into one region (2026-08-23; before that merge the rail link was
# unreachable from either side and this rule would have been dead data).
# Bidirectional: the Pass is a permanent key item and both attendants run
# the same check.
#
# The Pass is not the whole gate, though (dead seed fix, 0.9.1): a policeman
# stands in the corridor in front of that attendant until FLAG_RESTORED_POWER
# is set. Both 1F scripts test the flag before anything else
# (scr_seq_0893_T25R0501.s:20/28/39 and scr_seq_0834_T11R0601.s:21/40/51):
# the OnResume script only moves him aside (`MovePersonFacing`) once the
# power is back, and talking to him before that only yields "The train hasn't
# come in". The Power Plant is in Kanto, so in vanilla the train is never an
# early door. `power_plant_restored` is therefore written here as the real
# condition; rules.py drops it again, from this edge and every other one,
# when the `magnet_train` option is on, because the client then sets
# FLAG_RESTORED_POWER itself at the start of the game (client.py's
# _apply_power_plant_prerestored).
[[exit_rule]]
from = "goldenrod_magnet_train_station_2f"
to = "saffron_magnet_train_station_2f"
items = ["pass"]
events = ["power_plant_restored"]

# Route 36's Sudowoodo (`HasItem ITEM_SQUIRTBOTTLE` in scr_seq_0243_R36.s)
# blocks the whole crossroads, not just the way north to Route 37: until
# 2026-08-22 this gate sat on route_36 -> route_37 alone, which left Route
# 35, the National Park and, through them, Goldenrod and half of Johto free
# in sphere 0. The tree stands at x=415 on R36, the last tile of mapmatrix
# cell (12,7), while the Violet and Ruins of Alph warps are all in cell
# (13,7) and the National Park warp plus the Route 35/Route 37 grid
# neighbours are all in cells (11,7)/(12,7) -- so data_gen/regions.toml now
# splits R36 there into `route_36` (east, Violet side) and `route_36_west`
