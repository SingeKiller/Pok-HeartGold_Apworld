# The Goldenrod Radio Tower's shuttered door, verrou B6 (arbitrated by the
# user in game on 2026-08-23; it had been left unwritten until then, see the
# Known limitations block below for the wording this replaces).
#
# The lock itself is decomp-certain: scr_seq_0031_D23R0103.s:116-157 runs
# `GetItemQuantity ITEM_CARD_KEY, VAR_SPECIAL_RESULT` on the door and, with
# a quantity of 0, prints msg_0067_D23R0103_00010/00013 ("The door is
# locked... You need a Card Key"). With the key, `_01B4` walks the two
# shutter halves apart (obj_D23R0103_babyboy1_9 west,
# obj_D23R0103_babyboy1_9_2 east), hides both and sets FLAG_UNK_090, so the
# door stays open for good afterwards. The Card Key is itself a permanent
# key item, so both directions carry the same requirement (same reasoning as
# the S.S. Ticket entry above) and this uses the default bidirectional form.
#
# WHICH edge it sits on was the whole difficulty, and the decomp cannot
# settle it: the tower has two stairwells per floor and its collision data
# lives in binary NARCs this repo cannot read, so "the door is on map
# D23R0103" does not say which of that map's two staircases it blocks.
# D23R0101 is the ground floor, which made D23R0103 look like the 3rd floor
# and the gate look like a 3F -> 4F edge. The user settled it in game: going
# up from the entrance, a player climbs exactly ONE flight of stairs before
# hitting the locked door, i.e. the gate is on 2F -> 3F. The in-game
# observation wins over the naming: this tower's map numbering is offset by
# one relative to its floors. Everything above the door -- 3F, 4F, 5F, the
# elevator and the observation deck -- moves behind the Card Key with it.
[[exit_rule]]
from = "goldenrod_radio_tower_2f"
to = "goldenrod_radio_tower_3f"
items = ["card_key"]

