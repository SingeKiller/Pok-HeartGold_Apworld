# The Cycling Road, verrou D8 (2026-08-23). Both of its gatehouses run
# `PlayerOnBikeCheck VAR_SPECIAL_RESULT` on a coord trigger and bounce a
# player who is not riding: scr_seq_0207_R16R0201.s:25 (north gate, refusal
# msg_0356_R16R0201_00001, "You have to be on a Bicycle to go on the Cycling
# Road!") and scr_seq_0211_R18R0101.s:25 (south gate,
# msg_0359_R18R0101_00001, "Cycling Road is for cyclists only."). Both
# gatehouse interiors are laid out identically: door at x=1 on the Cycling
# Road side, door at x=10 on the town side, and two 1x3 coord triggers
# between them at x=5 and x=6 (376_R16R0201.json / 378_R18R0101.json).
#
# ONE WAY ONLY (bidirectional = false), which is what those two triggers'
# variables settle. The x=5 trigger fires on VAR_UNK_4129 == 0 and is the
# one that runs the bike check; on success it sets VAR_UNK_4129 and
# VAR_UNK_412A to 1, locks the bike on (SetBikeStateLock 1) and lets the
# player out onto the road. The x=6 trigger fires on VAR_UNK_412A == 1 and
# only undoes all that (SetBikeStateLock 0, both vars back to 0) -- it has
# no PlayerOnBikeCheck at all. So a player walking in from the town side
# meets x=6 first (inert, 412A still 0), then x=5, and is turned back
# without a Bicycle; a player coming off the road meets x=5 first (inert,
# 4129 now 1), then x=6, and simply gets dismounted. Leaving the Cycling
# Road is free, entering it is not. The distinction changes no reachability
# today (route_16/route_17/route_18 have no other entrance), but it is what
# the ROM does and it is what an entrance-randomizer pass would need.
#
# `route_18_gatehouse -> route_18` is the south gate's Cycling-Road side
# since data_gen/regions.toml rebuilt that gatehouse (see its comment): the
# gate's other door stands in for R18's short Fuchsia-side strip.
[[exit_rule]]
from = "route_16_gatehouse"
to = "route_16"
items = ["bicycle"]
bidirectional = false

[[exit_rule]]
from = "route_18_gatehouse"
to = "route_18"
items = ["bicycle"]
bidirectional = false

