[[exit_rule]]
from = "whirl_islands_b2f"
to = "whirl_islands_b3f"
hms = ["whirlpool"]

[[exit_rule]]
from = "whirl_islands_b2f"
to = "whirl_islands_b3f_lugia_cave"
