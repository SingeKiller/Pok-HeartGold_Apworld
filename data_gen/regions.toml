# The Blackthorn exit moved off 1F on 2026-08-23 (user verification in
# game): the real trip is route_44 -> 1F -> B1F -> (Strength boulders)
# -> B2F -> Blackthorn, and Blackthorn -> Route 44 needs nothing, the
# boulders stay where they fell.
#
# 1F does hold a Blackthorn door in the decomp's own warp table (zone_event
# 117_D39R0101.json, warp 1 at (55, 40)), so this is not a mapmatrix
# artifact -- it is the same one-map-two-places case as `ilex_forest` and
# `route_46`, and the ROM's own collision data says so outright. Flooding
# D39R0101's land_data (NitroFS a/0/6/5, matrix 132) from the Route 44 door
# at (11, 58) reaches 725 tiles, the B1F ladder at (55, 7) among them, and
# does NOT reach the Blackthorn door at (55, 40) or the second B1F ladder
# at (55, 20): those two sit together in a separate, ice-floored chamber on
# the same map. B1F and B2F are each cut in two the same way (B1F: the
# ladder to 1F-west and the ladder down to B2F on one side, the ladder to
# 1F-east and the other B2F ladder on the other; B2F likewise), which is
# the boulder puzzle itself. Rather than split three floors into six
# regions for one crossing, the Blackthorn edge is carried by `ice_path_b2f`
# -- the floor a player must actually reach before the Blackthorn-side
# chamber opens up -- and the Strength gate on B1F -> B2F is what stands
# between Route 44 and Blackthorn.
