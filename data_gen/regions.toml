# The direct `blackthorn` edge was REMOVED on 2026-08-24 (reported the day
# before, applied here). It was a method-2 mapmatrix false positive, same
# family as the route_32 <-> route_33, azalea <-> route_34 and cianwood <->
# route_47 pairs already removed (see their comments). The two maps do sit
# side by side on the EVERYWHERE grid -- Route 44 occupies matrix cells
# (17..19, 5), Blackthorn (20..21, 4..5), so they share the x=639/640 seam
# over z=160..191 -- but every tile of Route 44's own last two columns
# (x=638 and x=639) across that whole seam is impassable in the ROM's
# land_data (terrain word 0x8000, collision bit set), so nobody walks
# between them. The Ice Path is the only crossing, which is what the
# 2026-08-23 Ice Path fix above is about: while this edge stood, the
# Strength gate that fix put between Route 44 and Blackthorn was walked
# around in one step and was dead data.
#
# The cut is what makes that gate bite, so it is not a cosmetic tidy-up.
# Measured on the regenerated graph (full inventory minus Strength, versus
# full inventory), it moves exactly 16 regions and 47 non-Dexsanity checks
# behind Strength: `blackthorn` and its 7 interiors (including
# `blackthorn_gym`), `dragons_den_entrance`/`dragons_den`/
# `dragons_den_shrine` -- so the Rising Badge, whose location lives in the
# shrine, not in the gym, and therefore Waterfall -- plus
# `dark_cave_route_45_side`, `route_45`, `route_46_north`, `ice_path_b2f`
# and `ice_path_b3f`. Sphere 0 does not move at all (65 regions,
# {zephyr, hive}, 123 free checks): all 16 sat behind the Ilex Forest Cut
# gate already. Blackthorn keeps two ways in, both real and both behind the
# same HM: `ice_path_b2f` (the boulder puzzle itself) and `route_45`, which
# is only entered through Dark Cave's far side and costs Rock Smash plus
# Strength. Verified that nothing became unreachable with a full inventory.
[route_44]
map_code = 'R44'
exits = [
    'ice_path_1f',
    'mahogany',
    'route_44_surf',
]

[route_44_surf]
map_code = 'R44'
exits = [
    'route_44',
]

# route_45 -> route_46: hand patch (task M0.4, same category as this
# file's other documented hand patches above), one-way only. The mapmatrix
# adjacency this pair was extracted from (method 2 above) is inherently
# undirected and can't express the ledges between the two, and the
# direction was modeled backwards until 2026-08-19. The real geography:
# Route 45 is the mountain route hanging below Blackthorn, Route 46 is
# below it again, just above Route 29. The player comes DOWN from Route 45
# into Route 46, and the ledges never let them climb back up (community
# playtest report, krez, 2026-08-19: from Route 46's southern section the
# ledges block the way up, and entering its northern section through Dark
# Cave does not help either, since Route 45 has ledges of its own; no
# vanilla mechanism, HM or otherwise, reverses a ledge drop in any
# mainline Pokemon game).
#
# The inverted edge was not cosmetic: it opened new_bark -> route_29 ->
# route_46 -> route_45 -> blackthorn, putting the entire back half of
# Johto (Blackthorn, Mahogany, Ecruteak, Burned Tower) in sphere 1 and
# bypassing the Squirtbottle gate in rules.toml, which is itself correct
# but only guards Ecruteak's other entrances.
#
# Route 46 is itself split in two AP regions since 2026-08-22 (user
# verification on an interactive in-game map), same technique and same
# reason as the `ilex_forest`/`ilex_forest_north` split above: a ledge cuts
# the real R46 map in half, and the mapmatrix adjacency this graph was
# extracted from (method 2 in this file's header) cannot see it, so a
# single `route_46` region invented the phantom path route_29 ->
# route_46 -> dark_cave_route_31_side. Dark Cave's Route 46 entrance is
# NORTH of the ledge, i.e. unreachable from Route 29. `route_46` is the
# southern section (Route 29 side, the gatehouse), `route_46_north` is the
# northern one (Dark Cave side, under Route 45), and both keep map_code
# R46 since nothing in this codebase keys off map_code for region identity.
# route_45 -> route_46_north therefore replaces the old route_45 ->
# route_46: the drop from Route 45 lands north of the ledge.
[route_45]
map_code = 'R45'
exits = [
    'blackthorn',
    'dark_cave_route_45_side',
    'route_45_rock_climb',
    'route_46_north',
]

