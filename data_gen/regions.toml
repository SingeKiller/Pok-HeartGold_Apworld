# Split in two at the lake itself (task: Lake of Rage start-location
# soft-lock fix, 2026-08-23, player report + user verification on an
# interactive in-game map), same technique and same reason as the
# `ilex_forest`/`ilex_forest_north` and `route_46`/`route_46_north` splits
# above: T29 is one decomp map but not one walkable place, and the
# mapmatrix adjacency this graph was extracted from (method 2 in this
# file's header) cannot see the water in between.
#
# `lake_of_rage` is the shore the Route 43 path opens onto, with the
# Fishing Guru's house on it; `lake_of_rage_north` is everything on the far
# side of the water, starting with the Hidden Power house. Both keep
# map_code T29 since nothing in this codebase keys off map_code for region
# identity. The crossing is Surf, in data_gen/rules.toml.
#
# Corroborated directly against the real US ROM's own collision data
# (NitroFS a/0/6/5 land_data, terrain-attribute block at offset 0x14 of
# each 32x32 map block named by matrix 0's model table -- the same
# EVERYWHERE matrix method 2 uses): T29's six blocks hold 524 walk-on
# tiles, and they form SIX mutually disconnected patches, not one shore.
# The Hidden Power house's own front yard is a 16-tile patch (x 496-499,
# z 43-47) fenced by impassable scenery on two sides and by open lake water
# (terrain byte 0x10) on the other two -- which is exactly the soft-lock a
# player hit on 2026-08-23: `randomize_start_location` drops them at this
# map's warp anchor 0, and anchor 0 IS that house's door at (497, 42), see
# rom/startlocation.py.
[lake_of_rage]
map_code = 'T29'
exits = [
    'lake_of_rage_fishing_guru_house',
    'lake_of_rage_north',
    'lake_of_rage_surf',
    'route_43',
]

[lake_of_rage_surf]
map_code = 'T29'
exits = [
    'lake_of_rage',
]

# The far shore(s). Named `north` after the Hidden Power house's own bank,
# following `ilex_forest_north`/`route_46_north`, but it stands for every
# patch of T29 that has to be swum to, not only the northern one: the
# ROM-collision census above also puts the TM43 islet (x 504-507, z 34-35),
# the Choice Specs / Max Potion patch (x 538-543, z 36-38) and the Red
# Flute islet (x 486-491, z 72-74) across the water, and none of them
# touches any other patch on foot. Their locations live here, see
# data_gen/locations.toml.
[lake_of_rage_north]
map_code = 'T29'
