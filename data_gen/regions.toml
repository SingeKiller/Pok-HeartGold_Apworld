# Split in two at the map's own Cut tree (task: Ilex Forest soft-lock fix,
# 2026-08-18, player report + Debugger root-cause). `ilex_forest` (Azalea
# side) holds the Cut Master and the HM01 pickup, both freely reachable;
# `ilex_forest_north` (Route 34 side) holds every other item in the forest,
# all physically past the tree in vanilla. Both share map_code D36R0101 --
# same real map, two AP regions -- since only data_gen/rules.toml's own
# exit_rule (see its "Cut (hive badge)" entry) actually gates the crossing,
# nothing else in this codebase keys off map_code for region identity.
