# data_gen/regions.toml
#
# Source: ressources/Decomposition/pokeheartgold (read-only, gitignored),
# task C4 (Johto region graph, see docs/scope.md v1). Machine-extracted;
# see this repo's C4 handoff notes for the extraction methodology summary.
#
# Scope: Johto only (248 maps: routes, towns, and dungeon/interior floors).
# Kanto is out of scope for this task (a future C5 task); region keys use
# the same convention (lowercased include/constants/maps.h MAP_* constant,
# minus the MAP_ prefix) so C5 can add Kanto regions without renaming
# anything here. A handful of Johto regions (Mount Silver and its cave,
# Victory Road, Tohjo Falls) are, per the game's own map graph, only
# reachable via Kanto-side regions (e.g. Route 28, Route 22, Route 27) --
# their `exits` below intentionally reference those not-yet-defined Kanto
# region keys; data_gen_templates/regions.py must warn (not crash) on an
# unresolved exit target, exactly like data_gen_templates/items.py does
# for unresolved item references.
#
# `exits` is the *raw* connection graph only (task C4 scope) -- no access
# rules (HM/badge/item gating) are attached yet; that's task C6.
#
# Methodology (two decomp sources, both mechanical):
#   1. files/fielddata/eventdata/zone_event/*.json `warps` arrays: indoor
#      door/staircase connections (each entry's `header` field is the
#      destination map). Symmetrized (a warp back is assumed) since this
#      stage only models undirected raw connectivity.
#   2. files/fielddata/mapmatrix/map_matrix/map_matrix_0000_EVERYWHERE.bin:
#      the shared outdoor-overworld grid (see src/map_matrix.c's
#      MapMatrix_MapMatrixData_Load for the binary format -- width/height/
#      section-flags/name header followed by a width*height u16 `headers`
#      array of MAP_* ids, row-major). Adjacent grid cells with different,
#      non-zero map ids give real outdoor route<->route/town continuity
#      that `warps` doesn't capture (that's door-only). This is how e.g.
#      route_29's connections to new_bark/cherrygrove/route_46 were found.
#   3. Hand patches (not decomp-warp-derived, documented as such): the 4
#      Ruins of Alph Unown-puzzle hidden rooms (entered/exited via a
#      scripted mid-puzzle warp, not a static door tile, so it doesn't
#      appear in zone_event's `warps`) are linked back to their matching
#      entrance room; the Goldenrod <-> Saffron magnet train (a cutscene
#      warp, not a walk-in door) is linked the same way.
#
# `map_code` is the decomp's own map identifier (e.g. 'R29', 'T22GYM0101',
# 'D36R0101'), kept for cross-referencing against the decomp/ROM.

