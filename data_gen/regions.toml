# data_gen/regions.toml
#
# Source: ressources/Decomposition/pokeheartgold (read-only, gitignored),
# task C4 (Johto region graph) + task C5 (Kanto region graph, see
# docs/scope.md v1). Machine-extracted; see this repo's C4/C5 handoff notes
# for the extraction methodology summary.
#
# Scope: Johto (248 maps) + Kanto (202 maps): routes, towns, and
# dungeon/interior floors. Region keys use a consistent convention
# (lowercased include/constants/maps.h MAP_* constant, minus the MAP_
# prefix), so the two halves of the graph link up purely by key name --
# no region in this file was renamed when C5 added Kanto. A handful of
# Johto regions (Mount Silver and its cave, Victory Road, Tohjo Falls) are,
# per the game's own map graph, only reachable via Kanto-side regions
# (Route 28, Route 22's reception gate, Route 27) -- those Johto `exits`
# entries, dangling since C4, are now resolved by C5's Kanto regions.
#
# Kanto's own scope boundary (verified directly against
# include/constants/maps.h, not assumed): decomp map-code prefixes T01-T11
# (towns), R01-R18/R22/R24-R28 (routes -- note R19/20/21 don't exist as
# such, R23 doesn't exist at all, and R29+ is Johto), W19-W21 (water
# routes), and dungeons D01 (Diglett's Cave), D02 (Mt. Moon, incl. the
# Square sidequest floors), D03 (Cerulean Cave), D05 (Rock Tunnel), D10
# (Pal Park), D11 (Seafoam Islands, including the relocated Cinnabar Gym
# floor D11R0106), D46 (Viridian Forest), D48 (Cliff Edge Gate), D50 (Cliff
# Cave), D52 (Embedded Tower); plus P01 (the S.S. Aqua ferry, which
# straddles Olivine/Johto and Vermilion/Kanto and has no clean single-side
# home, modeled here as its own set of regions). Explicitly v2/out of
# scope and left as dangling `exits` targets, per docs/scope.md and this
# repo's C4/C5 task notes: D47 Safari Zone (incl. its Fuchsia-adjacent
# gate), D49 Pokeathlon Dome, D32/D31/C11 Battle Frontier (and its unused
# decomp leftovers), the WiFi Plaza/Union Room/GTS-adjacent non-map
# sentinel ids, and Sinjoh Ruins (D51, a Mystery Gift-only event area with
# no normal-play warp into it at all, decomp-verified). A further 5 decomp
# maps explicitly named `_UNUSED` (Route 5/9/20's unused variants, Saffron
# Unused, Seafoam Islands Unused) were checked and confirmed to have zero
# incoming warps anywhere in the decomp (unlike C4's
# national_park_unused_gatehouse, which despite its name *was*
# warp-reachable and had to be included) -- genuinely dead data, excluded.
#
# `exits` is the *raw* connection graph only (no access rules -- HM/badge/
# item gating -- attached yet; that's task C6).
#
# Methodology (two decomp sources, both mechanical):
#   1. files/fielddata/eventdata/zone_event/*.json `warps` arrays: indoor
#      door/staircase connections (each entry's `header` field is the
#      destination map). Symmetrized (a warp back is assumed) since this
#      stage only models undirected raw connectivity.
#   2. files/fielddata/mapmatrix/map_matrix/map_matrix_0000_EVERYWHERE.bin:
#      the shared outdoor-overworld grid (see src/map_matrix.c's
#      MapMatrix_MapMatrixData_Load for the binary format -- width/height/
#      section-flags/name header followed by a width*height u16 `headers`
#      array of MAP_* ids, row-major). Adjacent grid cells with different,
#      non-zero map ids give real outdoor route<->route/town continuity
#      that `warps` doesn't capture (that's door-only). This is how e.g.
#      route_29's connections to new_bark/cherrygrove/route_46 were found
#      (C4), and e.g. route_9's connection to Cerulean/route_10, which has
#      no zone_event warps at all, was found (C5).
#   3. Hand patches (not decomp-warp-derived, documented as such): the 4
#      Ruins of Alph Unown-puzzle hidden rooms (entered/exited via a
#      scripted mid-puzzle warp, not a static door tile, so it doesn't
#      appear in zone_event's `warps`) are linked back to their matching
#      entrance room; the Goldenrod <-> Saffron magnet train (a cutscene
#      warp, not a walk-in door, on *both* ends -- neither
#      T25R0502/goldenrod_magnet_train_station_2f nor
#      T11R0602/saffron_magnet_train_station_2f has any `warps` entry at
#      all) is linked the same way, and since 2026-08-23 each city's two
#      platform maps (with train / without train, T25R0502+T25R0503 and
#      T11R0602+T11R0603) are merged into that single with-train region
#      too, since they are one place in two script-selected states and the
#      1F staircase only ever reached the empty one (see the
#      goldenrod_magnet_train_station_2f comment). Elevators whose own zone_event `warps`
#      entry is a raw placeholder id (4095, meaning "script picks the
#      floor at runtime", not a real map) get their `exits` built
#      reverse-only, as the union of every floor whose own `warps` targets
#      that elevator (e.g. celadon_department_store_elevator,
#      celadon_condominiums_left_elevator/right_elevator,
#      saffron_silph_co_elevator) -- same pattern C4 used for Goldenrod's
#      department store/radio tower elevators and Olivine Lighthouse's.
#
# `map_code` is the decomp's own map identifier (e.g. 'R29', 'T22GYM0101',
# 'D36R0101'), kept for cross-referencing against the decomp/ROM.

