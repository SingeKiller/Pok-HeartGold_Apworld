# Route 36 is split in three AP regions around its Sudowoodo (obj_R36_usokky,
# overworld tile x=415 z=246, whose script scr_seq_0243_R36.s carries the
# `HasItem ITEM_SQUIRTBOTTLE` check). Corrected 2026-09-27 from the ROM's
# own collision data (tools/mapwalk.py with the tree as a wall, HeartGold
# and SoulSilver identical, and player reports): the tree is a three-way
# fork, open to the east, south and north (its west tile is a wall). Until
# then Route 36 had two halves, east and west, split on the mapmatrix cell
# seam at x=415/416, and Route 37 hung off the west half with no rule:
# Goldenrod -> Route 35 or the National Park -> Route 37 -> Ecruteak was in
# logic without the Squirtbottle.
#   - `route_36` (east, x 416-447): the Violet gatehouse and the Ruins of
#     Alph gatehouse; the side reached first from Violet. data_gen/
#     encounters.toml's `route_36` zone key stays attached to it for the
#     headbutt trees (the grass table is moved, see locations.py's
#     DEXSANITY_ZONE_METHOD_REGIONS).
#   - `route_36_west` (south of the tree, x 374-415): Route 35, the National
#     Park gatehouse and all of the route's grass.
#   - `route_36_north` (north of the tree, x 388-415 z 224-245): the only
#     way onto Route 37.
# Every edge between two of them crosses the tree, so each carries the
# Squirtbottle in data_gen/rules.toml. Watering it removes it for good, so
# all three edges are two-way. All three keep map_code R36; nothing in this
# codebase keys off map_code for region identity.
#
# The direct `violet` exit is gone since 2026-08-23 (user verification on an
# interactive in-game map): `violet_route_36_gatehouse` is the only crossing.
# See the [route_31] block for the shared rationale of this preventive pair.
