# Anchor block for the 2026-08-23 gatehouse sweep, third and final pass.
# Fourteen more `A <-> B` pairs each doubled the gatehouse that joins them;
# the user checked all fourteen buildings one by one on an interactive
# in-game map and found no outdoor crossing beside any of them, so every
# one of those direct edges is gone on both sides:
#   ecruteak  <-> route_38       route_38_ecruteak_gatehouse
#   ecruteak  <-> route_42       route_42_ecruteak_gatehouse
#   goldenrod <-> route_35       route_35_goldenrod_gatehouse
#   mahogany  <-> route_43       route_43_mahogany_gatehouse
#   fuchsia   <-> route_15       route_15_fuchsia_gatehouse
#   viridian  <-> route_1        viridian_route_1_gatehouse
#   saffron   <-> route_5        route_5_saffron_gatehouse
#   saffron   <-> route_6        route_6_saffron_gatehouse
#   saffron   <-> route_7        route_7_saffron_gatehouse
#   saffron   <-> route_8        route_8_saffron_gatehouse
#   route_2   <-> route_2_east   route_2_southeast_gatehouse
#   route_29  <-> route_46       route_29_route_46_gatehouse
#   route_32  <-> ruins_of_alph  route_32_ruins_of_alph_gatehouse
#   route_36  <-> ruins_of_alph  route_36_ruins_of_alph_gatehouse
# Same method-2 false positive as azalea <-> route_34 (2026-08-22) and as
# the Kanto and Violet pairs corrected earlier the same day (see their own
# blocks and this file's header): mapmatrix adjacency is undirected and
# cannot tell two maps that merely sit next to each other on the overworld
# grid from two maps a player can actually walk between.
#
# Preventive, and measured as such before it was applied: none of the
# fourteen gatehouses carries a data_gen/rules.toml rule today, so each
# path simply runs through the building instead and sphere 0 does not move
# (65 regions, badges zephyr + hive, 123 non-Dexsanity locations, before
# and after). See the [route_31] block for why an honest graph is worth it
# anyway: a gate on any of these gatehouses only bites once the edge beside
# it is gone, the way the Secret Potion gate only started biting once
# cianwood <-> route_47 went.
#
# With this pass every gatehouse-shaped pair the census knew about is
# resolved: fourteen here, and nine before it (azalea <-> route_34 and
# route_32 <-> route_33 on 2026-08-22, then route_11 <-> route_12,
# route_16 <-> route_16_east, fuchsia <-> route_18, fuchsia <-> route_19,
# cianwood <-> route_47, violet <-> route_31 and violet <-> route_36 on
# 2026-08-23).
#
# What is deliberately KEPT is a different motif, and the difference is
# worth stating because a naive "A and B are joined both directly and
# through some third region C" scan still flags it: the Elite Four rooms
# doubled by the entrance hall each of them opens back onto, Mount Mortar's
# 1F halves doubled by its 2F and B1F, and route_10 <-> route_10_south
# doubled by Rock Tunnel. In all three, C is not a gatehouse standing
# between two outdoor maps that the mapmatrix wrongly reported as adjacent:
# it is another floor or another room of the same building, and every one
# of those edges is a real door a player walks through. Removing them would
# be inventing geography, not correcting it. Same for the department store
# and Global Terminal elevators, which a scan like that flags by the dozen.
[ruins_of_alph]
map_code = 'D24R0101'
exits = [
    'route_32_ruins_of_alph_gatehouse',
    'route_36_ruins_of_alph_gatehouse',
    'ruins_of_alph_hall_entrance',
    'ruins_of_alph_hall_entrance_sinjoh_event',
    'ruins_of_alph_ledge',
    'ruins_of_alph_northeast_entrance_first_room',
    'ruins_of_alph_research_center',
    'ruins_of_alph_rocks',
    'ruins_of_alph_south',
    'violet',
]

