# data_gen/moves.toml
#
# Source: ressources/Decomposition/pokeheartgold (read-only, gitignored).
#   - files/poketool/waza/waza_tbl.narc: per-move MoveTbl struct
#     (effect, category, power, type, accuracy, pp, ...), see include/move.h.
#   - include/constants/moves.h: MOVE_* id/name constants (467 moves, no gaps).
#   - include/constants/move_effects.h: MOVE_EFFECT_* id/name constants,
#     used to name the `effect` field below (moves.h's own id, not a
#     separate lookup) -- added 2026-08-11 for the Nuzlocke-aid
#     `disable_ohko_moves` option (species.py). 6 effect ids used by real
#     moves have no symbolic #define in move_effects.h itself (37, 182-185,
#     199 -- rest/superpower/magic_coat/recycle/revenge+avalanche/
#     teeter_dance): these fall back to a synthetic `"effect_<n>"` string
#     instead of a real name, still uniquely identifying the raw value.
#   - src/item.c, sTMHMMoves[]: TM01-92/HM01-08 item -> move mapping.
#
# Types/categories are decoded from the numeric fields using
# include/constants/pokemon.h (TYPE_*) and include/constants/moves.h
# (CATEGORY_PHYSICAL/SPECIAL/STATUS).

