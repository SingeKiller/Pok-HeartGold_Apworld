# data_gen/species.toml
#
# Source: ressources/Decomposition/pokeheartgold (read-only, gitignored).
#   - include/constants/species.h: SPECIES_* id/name constants.
#   - files/poketool/personal/personal.json (baseStats): types, base stats,
#     catch rate, TM/HM compatibility (tms/hms are raw machine numbers,
#     resolved to moves via data_gen/moves.toml's [tm_hm] table).
#   - files/poketool/personal/evo.json (evoTable): evolution methods/targets.
#   - files/poketool/personal/wotbl.narc: per-species level-up learnset
#     (packed u16 entries: low 9 bits move id, high 7 bits level; see
#     include/pokemon.h LEVEL_UP_LEARNSET_*).
#   - files/application/zukanlist/zkn_data/zukan_data.json (sorting):
#     national/johto Pokedex ordering.
#
# 493 species (Bulbasaur..Arceus, national dex 1-493, Gen 1-4) plus 12 HGSS-
# relevant alternate forms with their own base-stats/learnset rows in the
# decomp: Deoxys (attack/defense/speed), Wormadam (sandy/trash cloak),
# Giratina (origin), Shaymin (sky), Rotom (heat/wash/frost/fan/mow) --
# 505 entries total. Unown's 28 letter forms and Shellos/Gastrodon's east/
# west forms are cosmetic/personality-value variants in this decomp: they do
# NOT have separate species ids or base-stats rows, so there is nothing
# separate to extract for them here.
#
# `abilities` (added 2026-08-11 for the Nuzlocke-aid `neutralize_trapping_
# abilities` option, species.py): `[ability1_id, ability2_id]`, raw
# `ABILITY_*` ids (include/constants/abilities.h) -- not names, since this
# project has no dedicated `data/abilities.py` naming table (unlike
# `type`/`category`, which already have one via `data/moves.py`'s own
# convention). `ability2 == 0` (`ABILITY_NONE`) means "no second ability",
# not a duplicate of ability1 -- matches personal.json's own convention
# and `rom/speciesdata.py`'s `_ABILITY2_OFFSET` docstring.
#
# johto_dex is present for the 256 species in HGSS's Regional (Johto) dex:
# the 251 original Kanto+Johto species plus 5 Sinnoh-introduced evolutions of
# Johto-linked species (Ambipom, Yanmega, Weavile, Lickilicky, Tangrowth --
# cross-checked against zukan_data.json and matches the publicly documented
# figure for HGSS's Johto dex).

